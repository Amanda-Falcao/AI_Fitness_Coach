name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run deterministic test suite
        run: python -m pytest -q
      - name: Validate notebook JSON and code-cell syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          for notebook_path in Path(".").glob("*.ipynb"):
              notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
              for cell_number, cell in enumerate(notebook.get("cells", []), start=1):
                  if cell.get("cell_type") == "code":
                      source = "".join(cell.get("source", []))
                      if any(line.lstrip().startswith(("!", "%")) for line in source.splitlines()):
                          continue  # Jupyter shell/line magics are not Python syntax.
                      ast.parse(source, filename=f"{notebook_path}:cell-{cell_number}")
          PY
